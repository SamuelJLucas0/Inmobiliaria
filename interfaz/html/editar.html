    <script>
        const fotoPerfil = document.getElementById('foto-perfil');
        const menu = document.getElementById('menu-desplegable');

        fotoPerfil.addEventListener('click', () => {
            menu.style.display = menu.style.display === 'block' ? 'none' : 'block';
        });

        // Cierra el menú si se hace clic fuera
        document.addEventListener('click', function(event) {
            if (!event.target.closest('.perfil-container')) {
                menu.style.display = 'none';
            }
        });

        const fileInput = document.getElementById('avatar');
        const fileNameSpan = document.getElementById('file-name-ine');
    
        // Escuchar el evento change en el input de tipo file
        fileInput.addEventListener('change', function(event) {
            const files = event.target.files;  // Obtener los archivos seleccionados
            let fileNames = [];  // Array para almacenar los nombres de los archivos
    
            // Iterar sobre los archivos y agregar sus nombres al array
            for (let i = 0; i < files.length; i++) {
                fileNames.push(files[i].name);  // Agregar el nombre de cada archivo
            }
    
            // Mostrar los nombres de los archivos en el span
            if (fileNames.length > 0) {
                fileNameSpan.textContent = fileNames.join(', ');  // Unir los nombres con coma
            } else {
                fileNameSpan.textContent = 'Ningún archivo seleccionado';  // Mensaje por defecto si no hay archivos
            }
        });
        function formatNumberWithCommas(value) {
            return value.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",");
        }
        
        // Selecciona los elementos del DOM
        const tamanoInput = document.getElementById('tamano');
        const precioInput = document.getElementById('precio');
        
        // Función para actualizar el valor formateado
        function updateFormattedValue(input, value) {
            input.value = formatNumberWithCommas(value);
        }
        
        // Escucha los cambios en el campo de tamaño
        tamanoInput.addEventListener('input', function() {
            let value = tamanoInput.value.replace(/,/g, ''); // Elimina las comas para poder trabajar con el valor numérico
            if (value) {
                updateFormattedValue(tamanoInput, parseInt(value));
            }
        });
        
        // Escucha los cambios en el campo de precio
        precioInput.addEventListener('input', function() {
            let value = precioInput.value.replace(/,/g, ''); // Elimina las comas para poder trabajar con el valor numérico
            if (value) {
                updateFormattedValue(precioInput, parseFloat(value));
            }
        });
    </script>

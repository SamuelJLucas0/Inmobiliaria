<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/miPerfil.css">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">
    <title>Document</title>
</head>
<body>
    <div>
        <div class="arriba">
            <a href="principal.html"><img src="../img/logo.png" alt="Logo de CASSAS" id="logo"></a>
             <h3 id="txt">Hola "Usuario" gracias por escoger CASSAS</h3>
            <div class="perfil-container">
                <img src="../img/user.jpg" alt="Foto de perfil" id="foto-perfil">
                <div class="menu-desplegable" id="menu-desplegable">
                    <a href="#">Mi perfil</a>
                    <a href="validacionUser.html">Validar mi cuenta</a>
                    <a href="publicar.html">Publica tu inmobiliaria</a>
                    <a href="#">Mis publicaciones</a>
                    <a href="inicio.html">Cerrar sesión</a>
                </div>
            </div>        
        </div>
        <div class="botones">
            
        </div>

        <div class="container">
            <div class="envoltorio-resultados">
                <div class="resultados">
                    <div class="foto">
                        <img src="../img/user.jpg" alt="foto de perfil" id="profile">
                        <h2 id="nameU">Juana Perez</h2>
                    </div>
                    <div class="datos-perfil">
                        <div class="number">
                            <img src="../img/cel.png" alt="celular">
                            <p id="phoneU"><strong></strong></p>
                        </div>
                        <div class="mail">
                            <img src="../img/mail.png" alt="correo">
                            <p id="mailU"><strong></strong></p>
                        </div>
                    </div>
                    <div class="validar" style="display: block;">
                        <h2 id="message">¡Valida tu cuenta para subir tu inmobiliaria!</h2>
                        <center><a style="display: block;" id="link" href="validacionUser.html">Valida Aqui</a></center>
                    </div>
                    <div class="vacio" style="display: block;">
                        <h2 id="mensaje">Sin publicaciones aún</h2>
                        <img id="vacio" src="../img/vacio.png" alt="Vacio">
                    </div>
                    <div class="resultados2">
                        
                    </div>
                    
                </div> 
            </div>
        </div>
    </div> 
    <script>
        const fotoPerfil = document.getElementById('foto-perfil');
        const menu = document.getElementById('menu-desplegable');

        fotoPerfil.addEventListener('click', () => {
            menu.style.display = menu.style.display === 'block' ? 'none' : 'block';
        });

        // Cierra el menú si se hace clic fuera
        document.addEventListener('click', function(event) {
            if (!event.target.closest('.perfil-container')) {
                menu.style.display = 'none';
            }
        });
    </script>
    <script src="../js/miPerfil.js"></script>
    
</body>
</html>

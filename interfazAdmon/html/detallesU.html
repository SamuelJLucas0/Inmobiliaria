<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Detalle de Validación</title>
  <link rel="stylesheet" href="../css/detallesU.css">
  <script src="https://unpkg.com/axios/dist/axios.min.js"></script>

</head>
<body>
  <div>
        <div class="arriba">
            <a href="principalA.html"><img src="../img/logo.png" alt="Logo de CASSAS" id="logo">
            </a><h3 id="txt">Bienvenido de nuevo, Aministrador</h3>
            <div class="perfil-container">
                <img src="../img/user.jpg" alt="Foto de perfil" id="foto-perfil">
            </div>            
        </div>
        <div class="botones">
            
        </div>

        <div class="container">
            <div class="envoltorio-resultados">
                <div class="resultados">
                    <div class="detalle-header">
                      <div class="imagen-seccion">
                        <center><h3>Imagen del Usuario:</h3></center>
                        <img id="fotoUsuario" src="" alt="Foto Usuario">
                      </div>
                      <div class="imagen-seccion">
                        <center><h3>Foto de la INE:</h3></center>
                        <img id="fotoIne" src="" alt="Foto INE">
                      </div>
                    </div>

                    <div class="caracteristicas-imagenes">
                        <div class="caracteristica">
                            <img src="../img/user.jpg" alt="Tipo de propiedad">
                            <p id="nombre">Casa</p>
                            <span class="cajatexto">
                                <span>Nombre del usuario</span>
                            </span>
                        </div>
                        <div class="caracteristica">
                            <img src="../img/mail.png" alt="Metros cuadrados">
                            <p id="email">400m²</p>
                            <span class="cajatexto">
                                <span>E-mail</span>
                            </span>
                        </div>
                        <div class="caracteristica">
                            <img src="../img/cel.png" alt="Cantidad de cuartos">
                            <p id="telefono">4</p>
                            <span class="cajatexto">
                                <span>Telefono</span>
                            </span>
                        </div>
                        <div class="caracteristica">
                            <img src="../img/dato.png" alt="Cantidad de baños">
                            <p id="curp">3</p>
                            <span class="cajatexto">
                                <span>CURP</span>
                            </span>
                        </div>
                        <div class="caracteristica">
                            <img src="../img/rfc.png" alt="Si/No">
                            <p id="rfc">Si</p>
                            <span class="cajatexto">
                                <span>RFC</span>
                            </span>
                        </div>
                        <div class="caracteristica">
                            <img src="../img/estado.png" alt="Si/No">
                            <p id="status">Si</p>
                            <span class="cajatexto">
                                <span>Estado:</span>
                            </span>
                        </div>
                    </div>

                    <div class="botones-detalle">
                      <button class="btn-verde">Validar</button>
                      <button class="btn-rojo">Rechazar</button>
                    </div>
                </div> 
            </div>
        </div>
    </div>

    
    <div class="boton-inicio">
        <a href="usuariosA.html">⬅ Regresar</a>
    </div>
  <script src="../js/detallesU.js"></script>
</body>
</html>

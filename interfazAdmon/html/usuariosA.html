<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de validaciones</title>
    <link rel="stylesheet" href="../css/usuariosA.css">
</head>
<body>
    
    <div>
        <div class="arriba">
            <a href="principalA.html"><img src="../img/logo.png" alt="Logo de CASSAS" id="logo">
            </a><h3 id="txt">Bienvenido de nuevo, Aministrador</h3>
            <div class="perfil-container">
                <img src="../img/user.jpg" alt="Foto de perfil" id="foto-perfil">
            </div>            
        </div>
        <div class="botones">
            
        </div>

        <div class="container">
            <div class="envoltorio-resultados">
                <div class="resultados">
                    <h1>Solicitudes de Validación</h1>
                    <div style="margin-bottom: 1em;">
                        <label for="filtroOrden">Ordenar por nombre:</label>
                        <select id="filtroOrden">
                            <option value="">Por estado</option>
                            <option value="AZ">Nombre (A-Z)</option>
                            <option value="ZA">Nombre (Z-A)</option>
                        </select>

                        <label for="filtroEstado" style="margin-left: 1em;">Filtrar por estado:</label>
                        <select id="filtroEstado">
                            <option value="">Todos</option>
                            <option value="En revisión">En revisión</option>
                            <option value="Validado">Validado</option>
                            <option value="Rechazado">Rechazado</option>
                        </select>
                    </div>
                    <div id="admin-container" class="admin-container">
                        <!-- Aquí se generarán dinámicamente las tarjetas de validación -->
                    </div>     
                </div> 
            </div>
        </div>
    </div>

    
  <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
  <script src="../js/usuariosA.js"></script>

</body>
</html>
